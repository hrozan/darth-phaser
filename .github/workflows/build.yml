name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    steps:
      - uses: actions/checkout@v4

      # JUCE needs the X11, ALSA and font development headers. The webkit and curl
      # packages are skipped because JUCE_WEB_BROWSER and JUCE_USE_CURL are both 0.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      # JUCE is fetched by CMake; caching it keeps most runs off the network.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DDARTHPHASER_INSTALL_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Stage artefacts
        shell: bash
        run: |
          set -euo pipefail
          artefacts="build/DarthPhaser_artefacts/${BUILD_TYPE}"
          [ -d "$artefacts" ] || artefacts="build/DarthPhaser_artefacts"

          # Stage under a named folder so every archive unpacks the same way.
          mkdir -p DarthPhaser/VST3 DarthPhaser/Standalone
          cp -R "$artefacts/VST3/." DarthPhaser/VST3/
          cp -R "$artefacts/Standalone/." DarthPhaser/Standalone/
          cp docs/INSTALL.txt DarthPhaser/INSTALL.txt
          find DarthPhaser -maxdepth 3

      # ditto preserves the bundle's permissions and resource forks; cmake -E tar
      # is fine for the plain files on the other two platforms.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent DarthPhaser "DarthPhaser-macOS.zip"

      - name: Package (Windows and Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: cmake -E tar cf "DarthPhaser-${{ matrix.name }}.zip" --format=zip DarthPhaser

      - uses: actions/upload-artifact@v4
        with:
          name: DarthPhaser-${{ matrix.name }}
          path: DarthPhaser-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # gh is preinstalled on the runner, so no third-party release action is needed.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Darth Phaser ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*.zip
